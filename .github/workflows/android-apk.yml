name: Build Android APK
on:
  push:
    paths:
      - 'mobile/**'
      - '.github/workflows/android-apk.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Create Android project scaffold
        run: flutter create --platforms=android --org ir.shajareh --project-name shajareh_app build_app
      - name: Add Shajareh app source
        run: |
          cp mobile/lib/main.dart build_app/lib/main.dart
      - name: Build release APK
        working-directory: build_app
        run: flutter build apk --release
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: shajareh-android-apk
          path: build_app/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30
